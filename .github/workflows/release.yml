name: Build Release APK

on:
  workflow_dispatch: # This adds the manual "Run workflow" button

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build Launcher Release
        run: |
          mkdir -p out
          ./gradlew :app_pojavlauncher:assembleFullRelease
          mv app_pojavlauncher/build/outputs/apk/full/release/app-pojavlauncher-unsigned.apk out/app-release-full.apk || mv app_pojavlauncher/build/outputs/apk/full/release/app-pojavlauncher-unsigned.apk out/app-release-full.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-package
          path: out/app-release-full.apk
