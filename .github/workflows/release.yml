name: Build Release APK

on:
  workflow_dispatch: # This adds the manual "Run workflow" button

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build Launcher Release
        run: |
          mkdir -p out
          
          ./gradlew :app_pojavlauncher:assembleFullRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/app_pojavlauncher/mojo_release_next.jks \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=mojo \
            -Pandroid.injected.signing.key.password=android
          
          mv app_pojavlauncher/build/outputs/apk/full/release/app_log4java-full-release.apk out/app-release-full.apk
          
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-package
          path: out/app-release-full.apk
